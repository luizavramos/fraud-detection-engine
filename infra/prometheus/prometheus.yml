# Alvos de todos os serviços do projeto (portas da constituição). Enquanto um serviço não estiver
# no compose, o alvo aparece como DOWN — esperado até as specs 001–006 entrarem.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Serviços Spring Boot: /actuator/prometheus
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["receiver:8081"]
        labels: { service: receiver }
      - targets: ["rule-management:8082"]
        labels: { service: rule-management }
      - targets: ["notification-service:8085"]
        labels: { service: notification-service }

  # Apps Kafka Streams (MiniHttpServer da platform-streams): /metrics
  - job_name: streams-services
    metrics_path: /metrics
    static_configs:
      - targets: ["customer-service:8083"]
        labels: { service: customer-service }
      - targets: ["detection-engine:8084"]
        labels: { service: detection-engine }
      - targets: ["transaction-service:8086"]
        labels: { service: transaction-service }
