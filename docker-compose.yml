# Infraestrutura local (spec 000, plan §5). Portas do host configuráveis por .env (ver .env.example).
# Os serviços da aplicação entram aqui pelas specs 001–006, cada um com depends_on: condition: service_healthy.
# Limites de memória modestos para máquinas de avaliação; o teste de 25k TPS roda em máquina maior.
name: motor-fraude

services:
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:${KAFKA_HOST_PORT:-9092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST: apps rodando na máquina do avaliador (localhost); INTERNAL: containers da rede do compose
      KAFKA_LISTENERS: HOST://:${KAFKA_HOST_PORT:-9092},INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # tópicos vêm do kafka-init
      # Um broker só: fator de replicação 1 (3 em produção). Exactly-once exige estes dois ajustes.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVER: kafka:29092
      PROFILE: local
    volumes:
      - ./infra/kafka-init/create-topics.sh:/init/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/init/create-topics.sh"]
    restart: "no"

  postgres:
    image: postgres:16.16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motorfraude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motorfraude}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motorfraude} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # "Banco legado": fonte do CDC. wal_level=logical é obrigatório para o Debezium.
  bank-db:
    image: postgres:16.16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "${BANK_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${BANK_DB_USER:-bank}
      POSTGRES_PASSWORD: ${BANK_DB_PASSWORD:-bank}
      POSTGRES_DB: bank
    volumes:
      - ./infra/bank-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - bank-db-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BANK_DB_USER:-bank} -d bank"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12
    # Escudo de carga do receiver: só chaves com TTL, sem persistência
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  connect:
    image: quay.io/debezium/connect:3.6.3.Final
    depends_on:
      kafka:
        condition: service_healthy
      bank-db:
        condition: service_healthy
    ports:
      - "${CONNECT_HOST_PORT:-18083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect-motor-fraude
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # Um broker só: o padrão (3) impede o Connect de subir
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # JSON puro, sem o bloco "schema": o tópico recebe o envelope Debezium (before/after/op/source)
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Todos os plugins do Debezium têm manifesto ServiceLoader; sem isto o Connect escaneia o classpath
      # por reflexão e leva ~3 minutos para subir (medido), estourando o limite de 3 min da H1.
      CONNECT_PLUGIN_DISCOVERY: service_load
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.4.15
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  bank-db-data:
