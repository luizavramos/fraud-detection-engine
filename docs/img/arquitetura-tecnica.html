<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>body{margin:0;background:#fff}svg{display:block}</style></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"></svg>
<script>
const svg=document.getElementById('s'), rc=rough.svg(svg);
const FONT="'Patrick Hand', 'Comic Sans MS', cursive";
const C={blue:'#ffffff',green:'#ffffff',yellow:'#ffffff',red:'#ffffff',violet:'#ffffff',gray:'#ffffff',orange:'#ffffff'};
let seed=3;
function add(n){svg.appendChild(n)}
function txt(x,y,lines,o={}){const size=o.size||18;(Array.isArray(lines)?lines:[lines]).forEach((l,i)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y+i*(size+3));t.setAttribute('text-anchor',o.anchor||'middle');t.setAttribute('font-family',FONT);t.setAttribute('font-size',size);t.setAttribute('fill',o.color||'#1e1e1e');if(o.bold)t.setAttribute('font-weight','bold');t.textContent=l;add(t)})}
function box(x,y,w,h,title,sub,color,o={}){add(rc.rectangle(x,y,w,h,{fill:C[color],fillStyle:'solid',stroke:'#1e1e1e',strokeWidth:o.sw||1.6,roughness:1.4,seed:seed++}));const n=sub?1:0;const top=y+h/2-(n*21)/2+6;txt(x+w/2,sub?top-2:y+h/2+6,title,{size:o.ts||20,bold:true});if(sub)txt(x+w/2,top+20,sub,{size:15,color:'#495057'})}
function cyl(x,y,w,h,title,sub,color){add(rc.ellipse(x+w/2,y+9,w,18,{fill:C[color],fillStyle:'solid',stroke:'#1e1e1e',roughness:1.2,seed:seed++}));add(rc.rectangle(x,y+9,w,h-18,{fill:C[color],fillStyle:'solid',stroke:'none',seed:seed++}));add(rc.line(x,y+9,x,y+h-9,{stroke:'#1e1e1e',roughness:1,seed:seed++}));add(rc.line(x+w,y+9,x+w,y+h-9,{stroke:'#1e1e1e',roughness:1,seed:seed++}));add(rc.ellipse(x+w/2,y+h-9,w,18,{fill:C[color],fillStyle:'solid',stroke:'#1e1e1e',roughness:1.2,seed:seed++}));add(rc.ellipse(x+w/2,y+9,w,18,{fill:C[color],fillStyle:'solid',stroke:'#1e1e1e',roughness:1.2,seed:seed++}));txt(x+w/2,y+h/2+(sub?-2:6),title,{size:19,bold:true});if(sub)txt(x+w/2,y+h/2+18,sub,{size:14,color:'#495057'})}
function arrow(pts,o={}){const opt={stroke:'#1e1e1e',strokeWidth:1.8,roughness:1.2,seed:seed++};if(o.dash)opt.strokeLineDash=[8,7];add(rc.linearPath(pts,opt));const head=(a,b)=>{const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=13;[0.45,-0.45].forEach(d=>add(rc.line(b[0],b[1],b[0]-L*Math.cos(ang+d),b[1]-L*Math.sin(ang+d),{stroke:'#1e1e1e',strokeWidth:1.8,roughness:.8,seed:seed++})))};head(pts[pts.length-2],pts[pts.length-1]);if(o.both)head(pts[1],pts[0]);if(o.label)txt(o.lx,o.ly,o.label,{size:15,color:'#1e1e1e'})}
function group(x,y,w,h,label,color){add(rc.rectangle(x,y,w,h,{stroke:color,strokeWidth:1.6,roughness:1.6,strokeLineDash:[10,8],seed:seed++}));txt(x+14,y+22,label,{anchor:'start',size:17,color:color,bold:true})}

txt(900,38,'Arquitetura técnica: componentes, tópicos Kafka e o motor por dentro',{size:30,bold:true});

cyl(30,770,190,80,'Lista de bloqueio','(seed / carga)','gray');

cyl(310,215,170,70,'Redis','anti-duplicata','red');

box(290,455,210,80,'rule-management :8082','API + versões + aprovação','blue',{ts:18});
box(290,620,210,80,'transaction-service :8086','carga de 90 dias','blue',{ts:18});

S(550,'4. Regras CEL em memória','conjunto ativo, troca a quente');

/* saídas */
T(1320,125,'fraud-decisions.v1','toda decisão');

box(1620,515,150,60,'Cliente','push · e-mail · SMS','orange',{ts:18});

arrow([[220,130],[290,130]],{label:'HTTP',lx:255,ly:118});
arrow([[395,170],[395,215]],{both:true,label:'SET NX',lx:440,ly:198});

arrow([[830,130],[925,150]]);

arrow([[830,810],[860,810],[860,320],[925,320]],{dash:true});
arrow([[1080,200],[1080,250]]);arrow([[1080,350],[1080,400]]);arrow([[1080,500],[1080,550]]);arrow([[1080,650],[1080,700]]);

arrow([[1570,480],[1620,462]]);arrow([[1570,510],[1620,545]]);
arrow([[1445,540],[1445,610]],{dash:true,label:'falha',lx:1480,ly:580});

txt(30,935,'Tracejado: dado que o motor lê como tabela local (sem chamada de rede) ou fluxo de exceção',{anchor:'start',size:16,color:'#495057'});
txt(30,962,'Retângulo: serviço, tópico ou etapa · Cilindro: banco de dados ou Redis · Tracejado grande: o motor',{anchor:'start',size:16,color:'#495057'});
document.fonts.ready.then(()=>{document.title='ready'});
</script></body></html>
